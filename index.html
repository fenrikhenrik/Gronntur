<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Blåtur Istanbul</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blåtur">
<meta name="theme-color" content="#E30A17">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --red:#E30A17; --red-dark:#8f0710; --dark:#0f1720; --ink:#1c2530;
  --muted:#6b7885; --line:#e4e8ec; --bg:#f5f7f9; --card:#fff;
  --ok:#1f8a5b; --warn:#c8962e;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(66px + var(--safe-bot))}

header{background:linear-gradient(135deg,var(--red-dark) 0%,var(--red) 60%,#ff3b46 100%);
  color:#fff;padding:calc(14px + var(--safe-top)) 18px 16px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.08)}
header h1{margin:0;font-size:21px;letter-spacing:-.3px;position:relative}
header .sub{margin:3px 0 0;font-size:13px;opacity:.93;position:relative}
.nedtelling{margin-top:12px;display:flex;gap:8px;position:relative}
.nt{background:rgba(255,255,255,.16);border-radius:10px;padding:7px 0;flex:1;text-align:center;
  backdrop-filter:blur(4px)}
.nt b{display:block;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.nt span{font-size:10px;text-transform:uppercase;letter-spacing:.7px;opacity:.85}

main{padding:14px 14px 20px;max-width:760px;margin:0 auto}
.tab{display:none}.tab.on{display:block;animation:inn .18s ease}
@keyframes inn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.kort{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,32,.05)}
.kort h2{margin:0 0 10px;font-size:16px;letter-spacing:-.2px}
.kort h3{margin:16px 0 8px;font-size:14px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.7px}

.dag{margin:20px 0 10px;font-size:13px;font-weight:700;color:var(--red);
  text-transform:uppercase;letter-spacing:1px}
.dag:first-child{margin-top:4px}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.post.uthevet{border-color:var(--red);border-width:2px;background:#fffbfb}
.post .tid{font-size:15px;font-weight:700;min-width:52px;font-variant-numeric:tabular-nums;
  padding-top:1px;letter-spacing:-.3px}
.post .inn{flex:1;min-width:0}
.post .tit{font-weight:650;font-size:15px;line-height:1.3}
.post .std{font-size:12.5px;color:var(--muted);margin-top:2px}
.post .det{font-size:13.5px;line-height:1.5;margin-top:7px;color:#39434f}
.post .ikon{font-size:19px;line-height:1}
.kartlenke{display:inline-block;margin-top:8px;font-size:13px;color:var(--red);
  text-decoration:none;font-weight:600}

.varsel{border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.5}
.v-viktig{background:#fff1f2;border:1px solid #f5c2c7}
.v-info{background:#eef6fd;border:1px solid #c9e0f5}
.v-gøy{background:#fdf6e3;border:1px solid #f0dfae}
.varsel .meta{font-size:11.5px;color:var(--muted);margin-top:6px}

#kart{height:62vh;min-height:340px;border-radius:14px;border:1px solid var(--line);z-index:1}
.filtre{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;
  font-size:13px;cursor:pointer;user-select:none}
.chip.on{color:#fff;border-color:transparent}
.gpsknapp{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:12px;
  border:1px solid var(--line);background:#fff;font:inherit;font-size:14.5px;font-weight:650;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.gpsknapp.pa{background:var(--red);border-color:transparent;color:#fff}
.gpsmelding{font-size:12.5px;line-height:1.45;color:var(--muted);margin:-4px 0 10px}
.gpsmelding.feil{color:var(--warn)}
@keyframes gpspuls{0%{transform:scale(1);opacity:.85}70%{transform:scale(2.6);opacity:0}100%{opacity:0}}
.gpspunkt{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;
  box-shadow:0 1px 6px rgba(0,0,0,.45);position:relative}
.gpspunkt::after{content:'';position:absolute;inset:-3px;border-radius:50%;
  background:rgba(26,115,232,.45);animation:gpspuls 2s ease-out infinite}

.qwrap{text-align:center}
.qframe{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px}
.qkat{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--red);font-weight:700}
.qteller{font-size:12px;color:var(--muted);margin-top:4px}
.qsp{font-size:19px;font-weight:650;line-height:1.35;margin:16px 0 18px;letter-spacing:-.2px}
.qalt{display:block;width:100%;padding:14px;margin-bottom:9px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;font-size:15.5px;text-align:left;
  cursor:pointer;font-family:inherit;color:var(--ink);transition:.12s}
.qalt:active{transform:scale(.985)}
.qalt.riktig{background:#e8f5ee;border-color:var(--ok);color:#14603f;font-weight:600}
.qalt.feil{background:#fdecee;border-color:var(--red);color:#8f0710}
.qalt:disabled{cursor:default}
.qfork{font-size:14px;line-height:1.5;background:#f7f9fa;border-radius:12px;
  padding:12px;margin-top:12px;text-align:left}
.knapp{background:var(--red);color:#fff;border:none;border-radius:12px;padding:14px 26px;
  font-size:16px;font-weight:650;font-family:inherit;cursor:pointer;margin-top:14px;width:100%}
.knapp.sek{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.score{font-size:46px;font-weight:800;color:var(--red);letter-spacing:-2px;line-height:1}
.stolpe{height:8px;background:#eef1f4;border-radius:6px;overflow:hidden;margin:14px 0}
.stolpe i{display:block;height:100%;background:var(--red);border-radius:6px;transition:.3s}

table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 0;border-bottom:1px solid #f0f2f5;vertical-align:top;line-height:1.45}
td:first-child{font-weight:600;width:38%;padding-right:12px}
tr:last-child td{border-bottom:none}

nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;
  padding-bottom:var(--safe-bot);z-index:1000}
nav button{flex:1;border:none;background:none;padding:9px 0 7px;font-family:inherit;
  font-size:10.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px}
nav button.on{color:var(--red);font-weight:650}
nav .ni{font-size:21px;line-height:1}

.status{position:fixed;top:calc(var(--safe-top) + 8px);right:12px;background:rgba(15,23,32,.82);
  color:#fff;font-size:11px;padding:5px 11px;border-radius:20px;z-index:2000;
  opacity:0;transition:.3s;pointer-events:none}
.status.vis{opacity:1}
.vaer{display:flex;gap:10px;margin-top:4px}
.vd{flex:1;background:#f7f9fa;border-radius:12px;padding:12px 8px;text-align:center;border:1px solid var(--line)}
.vd .dag{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.vd .sym{font-size:30px;line-height:1.25;margin:2px 0}
.vd .tmp{font-size:19px;font-weight:700;letter-spacing:-.5px}
.vd .tmp small{font-size:13px;font-weight:500;color:var(--muted)}
.vd .txt{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.vlaster{font-size:13.5px;color:var(--muted);padding:8px 0}
.fot{text-align:center;font-size:11.5px;color:var(--muted);padding:16px 0 4px;line-height:1.6}

.laas{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 20px;text-align:center}
.laas .ikon{font-size:52px;line-height:1}
.laas h2{margin:12px 0 8px;font-size:20px}
.laas p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 18px}
.kodefelt{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);
  font-size:17px;font-family:inherit;text-align:center;letter-spacing:1px;background:#fff;color:var(--ink)}
.kodefeil{color:var(--red);font-size:13.5px;font-weight:600;margin-top:10px;min-height:18px}

.qkort{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;
  font-family:inherit;cursor:pointer;color:var(--ink)}
.qkort .qi{font-size:31px;line-height:1;width:38px;text-align:center;flex:none}
.qkort .qt{font-weight:650;font-size:15.5px}
.qkort .qm{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.qkort .qs{font-size:19px;flex:none;opacity:.5}
.qkort.ferdig{border-color:#bfe3d0;background:#f6fcf9}
.lagliste{margin:4px 0 0}
.lagkort{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;text-align:left}
.lagkort b{font-size:14px}
.lagkort div{font-size:13.5px;color:#39434f;margin-top:3px;line-height:1.45}
.lagkort.ditt{border-color:var(--red);background:#fff6f6}
.lagkort.spilt{border-color:#bfe3d0;background:#f6fcf9}
.lagvelg{width:100%;text-align:left;font-family:inherit;cursor:pointer;color:var(--ink);background:var(--card)}

/* ---- Leaderboard ---- */
.lb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 15px 12px;margin-bottom:12px}
.lbtopp{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.lbtopp h2{margin:0;font-size:16px}
.lbtopp .pil{font-size:13px;color:var(--muted);font-weight:600;flex:none}
.lbnull{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}

.pall{display:flex;align-items:flex-end;gap:7px;margin:16px 0 6px}
.pall .pl{flex:1;text-align:center}
.pall .medalje{font-size:25px;line-height:1}
.pall .pnavn{font-size:13px;font-weight:700;margin-top:2px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pall .ppo{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.pall .sokkel{border-radius:9px 9px 0 0;display:flex;align-items:flex-start;justify-content:center;
  padding-top:6px;font-size:15px;font-weight:800;color:#fff}
.pall .p1 .sokkel{height:62px;background:linear-gradient(180deg,#e0b544,#c8962e)}
.pall .p2 .sokkel{height:46px;background:linear-gradient(180deg,#c3ccd4,#9aa6b1)}
.pall .p3 .sokkel{height:36px;background:linear-gradient(180deg,#cd9b66,#b07d46)}

.lbrad{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:14px}
.lbrad:last-child{border-bottom:none}
.lbrad .plass{width:22px;text-align:center;font-weight:700;color:var(--muted);font-size:13px;flex:none}
.lbrad .navn{flex:1;font-weight:600}
.lbrad .po{font-weight:700;font-size:14.5px;flex:none}
.lbrad .po small{font-weight:500;color:var(--muted);font-size:12px}

.lanterne{display:flex;align-items:center;gap:10px;margin-top:10px;padding:11px 12px;
  border:1px solid #f0c9cc;background:#fffbfb;border-radius:12px}
.lanterne .lykt{font-size:22px;line-height:1;flex:none}
.lanterne .lt{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--red)}
.lanterne .ln{font-size:14.5px;font-weight:700;margin-top:1px}
.lanterne .lp{font-weight:700;font-size:14.5px;flex:none;color:var(--red)}
.lbfot{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:11px;text-align:center}
.lbnullstill{background:none;border:none;font-family:inherit;font-size:11.5px;color:var(--muted);
  text-decoration:underline;cursor:pointer;padding:6px 0 0}

.kodeboks{background:#f7f9fa;border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:16px}
.kodetit{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.kodeverdi{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--red);margin:7px 0 12px;
  font-variant-numeric:tabular-nums}
.kodehjelp{font-size:12px;color:var(--muted);line-height:1.5;margin-top:9px}
.manuell{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.manuell label{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.manuell select{width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--line);
  background:#fff;font-size:16px;font-family:inherit;color:var(--ink)}

/* ---- Avsløringen: startskjermen før turen er røpet ---- */
#avsloring{position:fixed;inset:0;z-index:3000;background:var(--dark);color:#fff;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-top) + 26px) 18px calc(var(--safe-bot) + 26px)}
#avsloring[hidden]{display:none}
.avswrap{max-width:520px;margin:0 auto}
.avstit{font-size:25px;font-weight:800;letter-spacing:-.6px;text-align:center;margin:0 0 8px}
.avsing{font-size:14.5px;line-height:1.6;color:#aab4c0;text-align:center;margin:0 0 8px}
.avsteller{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:#7d8896;text-align:center;margin-bottom:20px}

.avsrad{display:flex;gap:12px;align-items:flex-start;margin-bottom:11px}
.avsboks{width:44px;height:44px;flex:none;border-radius:10px;border:2px solid #333f4d;
  background:#182230;display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;color:#3f4b5a;transition:.25s}
.avsboks.lost{background:var(--red);border-color:var(--red);color:#fff}
.avsinn{flex:1;min-width:0;padding-top:1px}
.avssp{font-size:14.5px;line-height:1.45;color:#e4e9ee}
.avsrad.lost .avssp{color:#7d8896}
.avssvar{font-size:13px;font-weight:700;color:#fff;margin-top:3px;letter-spacing:.5px}
.avsskriv{display:flex;gap:7px;margin-top:7px}
.avsfelt{flex:1;min-width:0;padding:10px 12px;border-radius:9px;border:1.5px solid #333f4d;
  background:#0d151f;color:#fff;font-size:16px;font-family:inherit;text-transform:uppercase}
.avsfelt::placeholder{color:#4a5665;text-transform:none}
.avsok{flex:none;padding:10px 15px;border-radius:9px;border:none;background:var(--red);
  color:#fff;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer}
.avshjelp{background:none;border:none;color:#7d8896;font-size:12.5px;font-family:inherit;
  text-decoration:underline;cursor:pointer;padding:6px 0 0}
.avsfeil{color:#ff8a95;font-size:12.5px;font-weight:600;margin-top:5px}

.avsfasit{text-align:center;padding:22px 0 6px}
.avsord{font-size:33px;font-weight:800;letter-spacing:5px;color:var(--red);margin:14px 0 6px}
.avsdato{font-size:15px;color:#aab4c0;margin-bottom:4px}
.avshopp{display:block;margin:20px auto 0;background:none;border:none;color:#55606e;
  font-size:12px;font-family:inherit;text-decoration:underline;cursor:pointer}

/* ---- Steg 1: gjettekonkurransen ---- */
.gnavn{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 4px}
.gnavn button{padding:11px 15px;border-radius:11px;border:1.5px solid #333f4d;background:#182230;
  color:#e4e9ee;font-size:15px;font-family:inherit;font-weight:600;cursor:pointer}
.gnavn button.valgt{background:var(--red);border-color:var(--red);color:#fff}
#gkart{height:46vh;min-height:270px;border-radius:14px;border:2px solid #333f4d;
  margin:16px 0 10px;background:#182230;z-index:1}
.gnal{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  background:var(--red);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gstatus{font-size:13.5px;line-height:1.5;color:#aab4c0;text-align:center;min-height:20px;margin-bottom:12px}
.gkode{background:#182230;border:1px solid #333f4d;border-radius:14px;padding:16px;text-align:center;margin-top:14px}
.gkodetit{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#7d8896}
.gkodeverdi{font-size:27px;font-weight:800;letter-spacing:2px;color:var(--red);margin:7px 0 12px}

/* ---- Steg 2b: sette sammen bokstavene ---- */
.abrikker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 6px}
.abrikke{width:42px;height:48px;border-radius:10px;border:2px solid #333f4d;background:#182230;
  color:#fff;font-size:22px;font-weight:800;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.abrikke.brukt{opacity:.22;cursor:default}
.aslisser{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px;min-height:52px}
.asliss{width:38px;height:46px;border-radius:9px;border:2px dashed #3f4b5a;background:#0d151f;
  display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#fff}
.asliss.fylt{border-style:solid;border-color:var(--red);background:#1c2530}
.afeil .asliss.fylt{border-color:#ff8a95}
</style>
</head>
<body>

<div class="status" id="status"></div>

<div id="avsloring" hidden></div>

<header>
  <h1>🇹🇷 Blåtur Istanbul</h1>
  <p class="sub" id="datoer">11.–13. september 2026</p>
  <div class="nedtelling" id="nedtelling"></div>
</header>

<main>
  <!-- FREDAG -->
  <div class="tab on" id="t-fre">
    <div id="program-fre"></div>
    <div class="fot" id="fot"></div>
  </div>

  <!-- LØRDAG OG SØNDAG -->
  <div class="tab" id="t-lor">
    <div id="program-lor"></div>
  </div>

  <!-- KART -->
  <div class="tab" id="t-kart">
    <div class="filtre" id="filtre"></div>
    <button class="gpsknapp" id="gpsknapp" type="button">📍 Vis hvor jeg er</button>
    <div class="gpsmelding" id="gpsmelding" hidden></div>
    <div id="kart"></div>
    <div class="fot">Trykk en markør for detaljer og veibeskrivelse.<br>Kartdata: OpenStreetMap</div>
  </div>

  <!-- QUIZ -->
  <div class="tab" id="t-quiz">
    <div id="leaderboard"></div>
    <div class="qwrap" id="quiz"></div>
  </div>

  <!-- INFO -->
  <div class="tab" id="t-info">
    <div id="info"></div>
    <div id="oppslag"></div>
  </div>
</main>

<nav>
  <button class="on" data-t="fre"><span class="ni">📋</span>Fre</button>
  <button data-t="lor"><span class="ni">🔒</span>Lør</button>
  <button data-t="kart"><span class="ni">🗺️</span>Kart</button>
  <button data-t="quiz"><span class="ni">🎯</span>Quiz</button>
  <button data-t="info"><span class="ni">ℹ️</span>Info</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   Blåtur Istanbul — app v1
   All tekst og alt innhold ligger i data.json.
   Denne filen skal du normalt ikke endre.
   ============================================================ */

let DATA = null;
let sisteVersjon = null;
let kartLaget = false;
let kartRef = null, markorer = [], aktiveKat = new Set();
let gpsVakt = null, gpsMarkor = null, gpsSirkel = null, gpsFulgt = true;

const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if(c) e.className = c; if(h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Låser ----------
   Én nøkkel pr. låst del. Åpnet én gang = åpen resten av turen, så ingen
   trenger å taste koden på nytt hver gang de bytter fane. */
let apnet = new Set();
try { apnet = new Set(JSON.parse(localStorage.getItem('blatur-apnet') || '[]')); } catch (e) {}
const erApnet = n => apnet.has(n);
function apne(n) {
  apnet.add(n);
  try { localStorage.setItem('blatur-apnet', JSON.stringify([...apnet])); } catch (e) {}
}
const kodeOk = (gitt, fasit) =>
  String(gitt || '').trim().toLowerCase() === String(fasit || '').trim().toLowerCase();

/* Felles låseskjerm. naar den aapnes kjoerer callback. */
function tegnLaas(boks, cfg, nokkel, etterpa) {
  boks.innerHTML =
    `<div class="laas">
      <div class="ikon">${cfg.ikon || '🔒'}</div>
      <h2>${esc(cfg.tittel || 'Låst')}</h2>
      <p>${esc(cfg.tekst || '')}</p>
      <input class="kodefelt" type="text" inputmode="text"
             autocomplete="off" autocorrect="off" autocapitalize="none"
             spellcheck="false" placeholder="Kode">
      <div class="kodefeil"></div>
      <button class="knapp kodeknapp">Lås opp</button>
    </div>`;
  const felt = boks.querySelector('.kodefelt');
  const feil = boks.querySelector('.kodefeil');
  const prov = () => {
    if (kodeOk(felt.value, cfg.kode)) {
      apne(nokkel);
      if (navigator.vibrate) navigator.vibrate(50);
      etterpa();
    } else {
      feil.textContent = 'Feil kode. Spør Henrik eller Bruland.';
      felt.value = '';
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    }
  };
  boks.querySelector('.kodeknapp').onclick = prov;
  felt.onkeydown = e => { if (e.key === 'Enter') prov(); };
}

/* ---------- Henting av data ---------- */
async function hentData(forste) {
  try {
    const r = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const ny = await r.json();

    if (!forste && sisteVersjon !== null && ny.versjon !== sisteVersjon) {
      visStatus('✨ Oppdatert');
      if (navigator.vibrate) navigator.vibrate(60);
    }
    sisteVersjon = ny.versjon;
    DATA = ny;
    tegnAlt();
    lagreLokalt(ny);
  } catch (e) {
    const lagret = localStorage.getItem('blatur-data');
    if (lagret && !DATA) { DATA = JSON.parse(lagret); tegnAlt(); visStatus('📴 Offline'); }
  }
}
function lagreLokalt(d) { try { localStorage.setItem('blatur-data', JSON.stringify(d)); } catch(e){} }
function visStatus(t) {
  const s = $('#status'); s.textContent = t; s.classList.add('vis');
  setTimeout(() => s.classList.remove('vis'), 2600);
}

/* ---------- Nedtelling ---------- */
function tegnNedtelling() {
  const boks = $('#nedtelling');
  if (!DATA?.tur?.avreise) return;
  const mal = new Date(DATA.tur.avreise), na = new Date();
  let d = Math.floor((mal - na) / 86400000);
  if (d < 0) { boks.innerHTML = '<div class="nt" style="flex:1"><b>Vi er her! 🇹🇷</b></div>'; return; }
  const t = Math.floor((mal - na) / 3600000) % 24;
  const m = Math.floor((mal - na) / 60000) % 60;
  boks.innerHTML =
    `<div class="nt"><b>${d}</b><span>dager</span></div>` +
    `<div class="nt"><b>${t}</b><span>timer</span></div>` +
    `<div class="nt"><b>${m}</b><span>min</span></div>`;
}

/* ---------- Program ----------
   Programmet er delt i to bolker. «fre» er alltid åpen. «lor» ligger bak
   kode, slik at ingen ser hele helgen med én gang.
   Merk: verken pris eller bekreftet-status vises her — det er arrangørenes
   arbeidsdata og hører hjemme i planen, ikke i appen. */
function tegnProgram(bolk) {
  const boks = $('#program-' + bolk);
  if (!boks) return;
  const laas = (DATA.laas || {})[bolk];

  if (laas && !erApnet('bolk-' + bolk)) {
    /* Appen henter data hvert 30. sekund. Uten denne sperren ville
       låseskjermen blitt tegnet på nytt midt i at noen taster koden,
       og det de har skrevet ville forsvunnet. */
    if (boks.querySelector('.kodefelt')) return;
    tegnLaas(boks, laas, 'bolk-' + bolk, () => tegnProgram(bolk));
    return;
  }

  boks.innerHTML = '';
  (DATA.program || []).filter(d => (d.bolk || 'fre') === bolk).forEach(dag => {
    boks.appendChild(el('div', 'dag', esc(dag.dag)));
    (dag.poster || []).forEach(p => {
      const d = el('div', 'post' + (p.uthevet ? ' uthevet' : ''));
      const kart = p.kart
        ? `<a class="kartlenke" href="#" data-kart="${esc(p.kart)}">📍 Vis på kart</a>` : '';
      d.innerHTML =
        `<div class="tid">${esc(p.tid)}</div>` +
        `<div class="inn">` +
          `<div class="tit">${p.ikon ? p.ikon + ' ' : ''}${esc(p.tittel)}</div>` +
          (p.sted ? `<div class="std">${esc(p.sted)}</div>` : '') +
          (p.detalj ? `<div class="det">${esc(p.detalj)}</div>` : '') +
          kart +
        `</div>`;
      boks.appendChild(d);
    });
  });

  boks.querySelectorAll('[data-kart]').forEach(a => {
    a.onclick = ev => {
      ev.preventDefault();
      bytt('kart');
      setTimeout(() => {
        const st = (DATA.steder || []).find(x => x.id === a.dataset.kart);
        if (st && kartRef) {
          kartRef.setView([st.lat, st.lon], 16);
          const m = markorer.find(x => x.__s.id === st.id);
          if (m) m.openPopup();
        }
      }, 350);
    };
  });

  if (bolk === 'fre') {
    $('#fot').innerHTML =
      `Sist oppdatert ${esc(DATA.sistOppdatert || '')} av ${esc(DATA.oppdatertAv || '')}<br>Versjon ${esc(DATA.versjon)}`;
  }
}

/* ---------- Kart ---------- */
const FARGER = { Base:'#111827', Program:'#E30A17', Uteliv:'#c8962e', Sightseeing:'#1f8a5b', Mat:'#0a5cb5', Transport:'#5d6b7a' };

function tegnKart() {
  if (!kartLaget) {
    kartRef = L.map('kart', { zoomControl: true }).setView([41.020, 28.985], 13);
    kartRef.on('dragstart', () => { gpsFulgt = false; });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(kartRef);
    kartLaget = true;
  }
  markorer.forEach(m => kartRef.removeLayer(m));
  markorer = [];

  const hotell = (DATA.steder || []).find(s => s.id === 'hotell') || { lat: 41.0246, lon: 28.9755 };
  const kats = [...new Set((DATA.steder || []).map(s => s.kat))];
  if (!aktiveKat.size) kats.forEach(k => aktiveKat.add(k));

  const f = $('#filtre'); f.innerHTML = '';
  kats.forEach(k => {
    const c = el('span', 'chip' + (aktiveKat.has(k) ? ' on' : ''), esc(k));
    if (aktiveKat.has(k)) c.style.background = FARGER[k] || '#333';
    c.onclick = () => { aktiveKat.has(k) ? aktiveKat.delete(k) : aktiveKat.add(k); tegnKart(); };
    f.appendChild(c);
  });

  (DATA.steder || []).filter(s => aktiveKat.has(s.kat)).forEach(s => {
    const farge = FARGER[s.kat] || '#333';
    const stor = s.kat === 'Program' || s.kat === 'Base';
    const st = stor ? 20 : 14;
    const ikon = L.divIcon({
      className: '', iconSize: [st, st], iconAnchor: [st/2, st/2],
      html: `<div style="width:${st}px;height:${st}px;border-radius:50%;background:${farge};
        border:${stor ? '3px solid #ffd24a' : '2px solid #fff'};box-shadow:0 1px 5px rgba(0,0,0,.4)"></div>`
    });
    const gmaps = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
    const gange = `https://www.google.com/maps/dir/?api=1&origin=${hotell.lat},${hotell.lon}&destination=${s.lat},${s.lon}&travelmode=walking`;
    const m = L.marker([s.lat, s.lon], { icon: ikon, title: s.navn }).bindPopup(
      `<div style="min-width:200px;font-family:-apple-system,sans-serif">
        <div style="font-weight:700;font-size:14.5px;margin-bottom:3px">${esc(s.navn)}</div>
        <div style="font-size:12.5px;line-height:1.45;margin-bottom:9px;color:#39434f">${esc(s.notat || '')}</div>
        <a href="${gmaps}" target="_blank" style="font-size:13px;color:#E30A17;font-weight:600">Åpne i Maps</a> &nbsp;·&nbsp;
        <a href="${gange}" target="_blank" style="font-size:13px;color:#E30A17;font-weight:600">Gå dit</a>
      </div>`);
    m.__s = s; m.addTo(kartRef); markorer.push(m);
  });
  setTimeout(() => kartRef.invalidateSize(), 120);
}

/* ---------- Hvor er jeg? ----------
   Posisjonen kommer fra telefonens egen GPS og krever ikke nett — men
   bakgrunnskartet gjør det. Uten dekning ser du prikken din bevege seg
   mellom markørene på grå bakgrunn, og det holder for å finne veien hjem.
   Krever HTTPS. Ingenting lagres og ingenting sendes videre. */
function gpsMelding(tekst, erFeil) {
  const m = $('#gpsmelding');
  if (!m) return;
  m.textContent = tekst || '';
  m.classList.toggle('feil', !!erFeil);
  m.hidden = !tekst;
}

function stoppGps() {
  if (gpsVakt !== null) { navigator.geolocation.clearWatch(gpsVakt); gpsVakt = null; }
  if (gpsMarkor) { kartRef.removeLayer(gpsMarkor); gpsMarkor = null; }
  if (gpsSirkel) { kartRef.removeLayer(gpsSirkel); gpsSirkel = null; }
  $('#gpsknapp').classList.remove('pa');
  $('#gpsknapp').textContent = '📍 Vis hvor jeg er';
  gpsMelding('');
}

function startGps() {
  if (!navigator.geolocation) {
    gpsMelding('Telefonen din gir ikke appen tilgang til posisjon.', true);
    return;
  }
  const knapp = $('#gpsknapp');
  knapp.classList.add('pa');
  knapp.textContent = '📍 Følger posisjonen din — trykk for å slå av';
  gpsMelding('Leter etter satellitter …');
  gpsFulgt = true;

  gpsVakt = navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    const nyaktig = Math.round(pos.coords.accuracy || 0);

    if (!gpsMarkor) {
      gpsMarkor = L.marker([lat, lon], {
        zIndexOffset: 1000,
        icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9],
                          html: '<div class="gpspunkt"></div>' })
      }).addTo(kartRef);
      gpsSirkel = L.circle([lat, lon], { radius: nyaktig, color: '#1a73e8', weight: 1,
                                         fillColor: '#1a73e8', fillOpacity: .12 }).addTo(kartRef);
      kartRef.setView([lat, lon], 16);
    } else {
      gpsMarkor.setLatLng([lat, lon]);
      gpsSirkel.setLatLng([lat, lon]).setRadius(nyaktig);
      /* Slutter å hoppe etter deg så snart du drar i kartet selv. */
      if (gpsFulgt) kartRef.panTo([lat, lon]);
    }

    const h = (DATA.steder || []).find(s => s.id === 'hotell');
    let avstand = '';
    if (h) {
      const meter = kartRef.distance([lat, lon], [h.lat, h.lon]);
      avstand = meter < 1000
        ? ' · ' + Math.round(meter) + ' m til hotellet'
        : ' · ' + (meter / 1000).toFixed(1).replace('.', ',') + ' km til hotellet';
    }
    gpsMelding('Nøyaktig innenfor ca. ' + nyaktig + ' meter' + avstand);
  }, feil => {
    const tekst = feil.code === 1
      ? 'Du har sagt nei til posisjon. Slå den på under Innstillinger → Safari → Posisjon.'
      : feil.code === 3
        ? 'Fikk ikke tak i posisjonen. Prøv igjen ute, gjerne bort fra høye bygg.'
        : 'Posisjonen er ikke tilgjengelig akkurat nå.';
    gpsMelding(tekst, true);
    knapp.classList.remove('pa');
    knapp.textContent = '📍 Vis hvor jeg er';
    if (gpsVakt !== null) { navigator.geolocation.clearWatch(gpsVakt); gpsVakt = null; }
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

/* ---------- Avsløringen ----------
   Startskjerm som ligger over alt annet til den er ferdig. To steg:

   1. Gjettekonkurransen. Sett en nål der du tror turen går. Ingen svar
      gis — bare en kode du sender Henrik. Rangeringen kommer etterpå.
   2. Bokstavjakten. Åtte spørsmål gir åtte bokstaver i tilfeldig
      rekkefølge, som skal settes sammen til reisemålet.

   Ferdig én gang = borte for godt på den telefonen. */
let avsSteg = null;
let avsLost = [], avsBom = {}, avsValgt = [], avsAnagramFeil = false;
let gjettNavn = null, gjettPunkt = null, gjettKart = null, gjettNal = null;

try { avsLost = JSON.parse(localStorage.getItem('blatur-avs') || '[]'); } catch (e) {}

const avsFerdig = () => { try { return localStorage.getItem('blatur-avslort') === 'ja'; } catch (e) { return false; } };
const gjettGjort = () => { try { return !!localStorage.getItem('blatur-mittgjett'); } catch (e) { return false; } };
function avsLagre() { try { localStorage.setItem('blatur-avs', JSON.stringify(avsLost)); } catch (e) {} }

function normaliserSvar(t) {
  return String(t || '').toUpperCase()
    .replace(/Æ/g, 'AE').replace(/Ø/g, 'O').replace(/Å/g, 'A')
    .replace(/[^A-Z0-9]/g, '');
}
const avsBokstav = r => normaliserSvar(r.svar)[r.pos] || '?';

/* Kode med gjettet: G + person + avstand + kontrollbokstav.
   Avstanden skrives i 24-tallssystem, ikke som tall — ellers kunne den
   som fikk koden lese sitt eget resultat før avsløringen. */
function lagGjettkode(personIdx, km) {
  let n = Math.max(0, Math.min(13823, Math.round(km)));
  const kropp = 'G' + KODEBOK[personIdx] +
    KODEBOK[Math.floor(n / 576)] + KODEBOK[Math.floor(n / 24) % 24] + KODEBOK[n % 24];
  return kropp + sjekkTegn(kropp);
}

function tegnAvsloring(tvungen) {
  const boks = $('#avsloring');
  if (!boks) return;
  const a = DATA && DATA.avsloring;
  if (!a || !a.aktiv || avsFerdig()) { boks.hidden = true; return; }
  boks.hidden = false;

  /* Appen henter data hvert 30. sekund. Uten denne sperren ville skjermen
     blitt tegnet på nytt midt i at noen skriver eller peker på kartet. */
  if (!tvungen && (boks.querySelector('.avsfelt') || boks.querySelector('#gkart'))) return;

  const g = a.gjett || {};
  if (avsSteg === null) avsSteg = (g.aktiv && !gjettGjort()) ? 'gjett' : 'ord';

  if (avsSteg === 'gjett') return tegnGjett(boks, a, g);
  return tegnBokstavjakt(boks, a);
}

/* ---------- Steg 1: hvor tror du turen går? ---------- */
function tegnGjett(boks, a, g) {
  const folk = DATA.deltakere || [];
  boks.innerHTML =
    `<div class="avswrap">
      <div class="avstit">${esc(g.tittel || 'Hvor tror du turen går?')}</div>
      <div class="avsing">${esc(g.ingress || '')}</div>
      <div class="avsteller">Steg 1 av 2</div>
      <div style="font-size:13.5px;color:#aab4c0;text-align:center">Hvem gjetter?</div>
      <div class="gnavn" id="gnavn"></div>
      <div id="gkart"></div>
      <div class="gstatus" id="gstatus">Velg navnet ditt, og trykk på kartet der du tror vi skal.</div>
      <button class="knapp" id="glaas">Lås inn gjettet</button>
      <button class="avshopp" id="ghopp">Hopp over — jeg vet hvor vi skal</button>
    </div>`;

  const navnBoks = $('#gnavn');
  folk.forEach(n => {
    const b = el('button', gjettNavn === n ? 'valgt' : '', esc(n));
    b.onclick = () => { gjettNavn = n; tegnGjett(boks, a, g); };
    navnBoks.appendChild(b);
  });

  gjettKart = L.map('gkart', { zoomControl: true, worldCopyJump: false })
    .setView(g.senter || [50, 15], g.zoom || 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 12, minZoom: 3, attribution: '&copy; OpenStreetMap' }).addTo(gjettKart);
  setTimeout(() => gjettKart.invalidateSize(), 120);

  const nalIkon = L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 22],
    html: '<div class="gnal"></div>' });

  if (gjettPunkt) gjettNal = L.marker(gjettPunkt, { icon: nalIkon }).addTo(gjettKart);

  gjettKart.on('click', ev => {
    gjettPunkt = [ev.latlng.lat, ev.latlng.lng];
    if (gjettNal) gjettKart.removeLayer(gjettNal);
    gjettNal = L.marker(gjettPunkt, { icon: nalIkon }).addTo(gjettKart);
    $('#gstatus').textContent = gjettNavn
      ? 'Nålen står. Flytt den så mye du vil — den teller først når du låser inn.'
      : 'Nålen står. Velg navnet ditt før du låser inn.';
  });

  $('#glaas').onclick = () => {
    if (!gjettNavn) { $('#gstatus').textContent = 'Velg navnet ditt først.'; return; }
    if (!gjettPunkt) { $('#gstatus').textContent = 'Trykk på kartet der du tror vi skal.'; return; }
    const f = (DATA.avsloring.gjett || {}).fasit || {};
    const km = gjettKart.distance(gjettPunkt, [f.lat, f.lon]) / 1000;
    const idx = (DATA.deltakere || []).indexOf(gjettNavn);
    const kode = lagGjettkode(idx, km);
    try {
      localStorage.setItem('blatur-mittgjett', JSON.stringify(
        { navn: gjettNavn, lat: gjettPunkt[0], lon: gjettPunkt[1], km: Math.round(km), kode: kode }));
      localStorage.setItem('blatur-navn', gjettNavn);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(60);
    tegnGjettKvittert(boks, kode);
  };

  $('#ghopp').onclick = () => {
    if (confirm('Hoppe over? Da er reisemålet røpet.')) {
      try { localStorage.setItem('blatur-avslort', 'ja'); } catch (e) {}
      boks.hidden = true;
    }
  };
}

function tegnGjettKvittert(boks, kode) {
  gjettKart = null;
  boks.innerHTML =
    `<div class="avswrap avsfasit">
      <div style="font-size:46px;line-height:1">📍</div>
      <div class="avstit" style="margin-top:10px">Gjettet er låst</div>
      <div class="avsing">Nålen står, og den kan ikke flyttes.
        <b>Du får ikke vite hvor nær du var før alle har levert.</b></div>
      <div class="gkode">
        <div class="gkodetit">Steg 1 · send denne til Henrik</div>
        <div class="gkodeverdi">${esc(visKode(kode))}</div>
        <button class="knapp" id="gsend">📤 Send gjettet på SMS</button>
        <div style="font-size:12.5px;color:#7d8896;line-height:1.5;margin-top:10px">
          Koden sier hvem du er og hvor langt unna du var — men den er skrevet om,
          så du kan ikke lese ditt eget resultat ut av den.</div>
      </div>
      <div class="avsing" style="margin-top:20px">
        <b>Steg 2 kommer når Henrik gir klarsignal.</b><br>
        Vent til alle ni har sendt inn.</div>
      <button class="knapp sek" id="gvidere" style="margin-top:12px">Jeg har sendt — gå videre</button>
    </div>`;
  $('#gsend').onclick = async () => {
    const mitt = JSON.parse(localStorage.getItem('blatur-mittgjett') || '{}');
    const tekst = `Blåtur — mitt gjett\n${mitt.navn}\nKode: ${visKode(kode)}`;
    const r = await delTekst(tekst);
    if (r === 'kopiert') visStatus('📋 Kopiert — lim inn i SMS');
    else if (r === 'nei') alert(tekst);
  };
  $('#gvidere').onclick = () => { avsSteg = 'ord'; tegnAvsloring(true); };
}

/* ---------- Steg 2: åtte bokstaver som skal settes sammen ---------- */
function tegnBokstavjakt(boks, a) {
  const k = a.kryssord || {};
  const rader = k.rader || [];
  if (!rader.length) { boks.hidden = true; return; }
  const antall = rader.length;
  const lost = rader.filter((r, i) => avsLost[i]).length;

  /* --- Alle bokstavene funnet: sett dem sammen --- */
  if (lost === antall) {
    const bokstaver = rader.map(avsBokstav);
    let h = `<div class="avswrap">
        <div class="avstit">${esc(k.fasittittel || 'Åtte bokstaver')}</div>
        <div class="avsing">${esc(k.fasitingress || 'Sett dem sammen. Hva blir det?')}</div>
        <div class="aslisser${avsAnagramFeil ? ' afeil' : ''}" id="aslisser"></div>
        <div class="abrikker" id="abrikker"></div>
        <div class="gstatus" id="astatus">${avsAnagramFeil ? 'Ikke helt. Prøv en annen rekkefølge.' : ''}</div>
        <button class="knapp sek" id="atom">Start på nytt</button>
      </div>`;
    boks.innerHTML = h;

    const slisser = $('#aslisser'), brikker = $('#abrikker');
    for (let i = 0; i < antall; i++) {
      const b = avsValgt[i] === undefined ? '' : bokstaver[avsValgt[i]];
      slisser.appendChild(el('div', 'asliss' + (b ? ' fylt' : ''), esc(b)));
    }
    bokstaver.forEach((bok, i) => {
      const brukt = avsValgt.indexOf(i) >= 0;
      const b = el('button', 'abrikke' + (brukt ? ' brukt' : ''), esc(bok));
      if (!brukt) b.onclick = () => {
        avsValgt.push(i); avsAnagramFeil = false;
        if (avsValgt.length === antall) {
          const forsok = avsValgt.map(j => bokstaver[j]).join('');
          if (forsok === normaliserSvar(a.losningsord)) {
            try { localStorage.setItem('blatur-ordlost', 'ja'); } catch (e) {}
            if (navigator.vibrate) navigator.vibrate([60, 80, 120]);
            return tegnFasit(boks, a);
          }
          avsAnagramFeil = true; avsValgt = [];
        }
        tegnBokstavjakt(boks, a);
      };
      brikker.appendChild(b);
    });
    $('#atom').onclick = () => { avsValgt = []; avsAnagramFeil = false; tegnBokstavjakt(boks, a); };
    return;
  }

  /* --- Spørsmålene --- */
  let h = `<div class="avswrap">
      <div class="avstit">${esc(k.tittel || 'Åtte spørsmål')}</div>
      <div class="avsing">${esc(k.ingress || '')}</div>
      <div class="avsteller">${lost} av ${antall} funnet</div>`;

  rader.forEach((r, i) => {
    const erLost = !!avsLost[i];
    h += `<div class="avsrad${erLost ? ' lost' : ''}">
        <div class="avsboks${erLost ? ' lost' : ''}">${erLost ? esc(avsBokstav(r)) : ''}</div>
        <div class="avsinn">
          <div class="avssp">${esc(r.sporsmal)}</div>`;
    if (erLost) {
      h += `<div class="avssvar">${esc(normaliserSvar(r.svar) ? r.svar.toUpperCase() : '')}</div>`;
    } else {
      h += `<div class="avsskriv">
              <input class="avsfelt" type="text" inputmode="text" data-i="${i}"
                     autocomplete="off" autocorrect="off" autocapitalize="characters"
                     spellcheck="false" placeholder="Svar">
              <button class="avsok" data-i="${i}">OK</button>
            </div>
            <div class="avsfeil" data-feil="${i}"></div>`;
      if (avsBom[i]) h += `<button class="avshjelp" data-hjelp="${i}">Gi meg denne</button>`;
    }
    h += `</div></div>`;
  });
  h += `<button class="avshopp" id="avshopp">Hopp over — jeg vet hvor vi skal</button></div>`;
  boks.innerHTML = h;

  const prov = i => {
    const felt = boks.querySelector('.avsfelt[data-i="' + i + '"]');
    const feil = boks.querySelector('[data-feil="' + i + '"]');
    const fasit = normaliserSvar(rader[i].svar);
    if (fasit && normaliserSvar(felt.value) === fasit) {
      avsLost[i] = true; avsLagre();
      if (navigator.vibrate) navigator.vibrate(45);
      tegnBokstavjakt(boks, a);
    } else {
      avsBom[i] = (avsBom[i] || 0) + 1;
      feil.textContent = avsBom[i] > 1 ? 'Fortsatt ikke riktig.' : 'Ikke riktig — prøv igjen.';
      felt.value = '';
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      if (avsBom[i] === 1) tegnBokstavjakt(boks, a);
    }
  };
  boks.querySelectorAll('.avsok').forEach(b => { b.onclick = () => prov(+b.dataset.i); });
  boks.querySelectorAll('.avsfelt').forEach(f => {
    f.onkeydown = e => { if (e.key === 'Enter') prov(+f.dataset.i); };
  });
  boks.querySelectorAll('[data-hjelp]').forEach(b => {
    b.onclick = () => { avsLost[+b.dataset.hjelp] = true; avsLagre(); tegnBokstavjakt(boks, a); };
  });
  $('#avshopp').onclick = () => {
    if (confirm('Hoppe over? Da er reisemålet røpet.')) {
      rader.forEach((r, i) => avsLost[i] = true);
      avsLagre(); tegnBokstavjakt(boks, a);
    }
  };
}

/* ---------- Selve avsløringen ---------- */
function tegnFasit(boks, a) {
  let mitt = null;
  try { mitt = JSON.parse(localStorage.getItem('blatur-mittgjett') || 'null'); } catch (e) {}
  boks.innerHTML =
    `<div class="avswrap avsfasit">

      <div class="avstit" style="margin-top:10px">${esc(a.fasittittel || 'Der skal vi')}</div>
      <div class="avsord">${esc(normaliserSvar(a.losningsord).split('').join(' '))}</div>
      <div class="avsdato">${esc(a.fasittekst || '')}</div>
      ${mitt ? `<div class="gkode" style="margin-top:18px">
          <div class="gkodetit">Ditt gjett</div>
          <div style="font-size:15px;color:#e4e9ee;margin:8px 0 2px">Du bommet med</div>
          <div class="gkodeverdi" style="letter-spacing:0">${mitt.km} km</div>
          <div style="font-size:12.5px;color:#7d8896;line-height:1.5">

  $('#avsapne').onclick = () => {

/* ---------- Resultater og koder ----------
   Ett resultat = én quiz + ett lag + poengsum. Alt lagres slik, og
   personlige totaler regnes ut fra det. Da kan et helt resultat sendes
   som en kort kode over SMS, uten server og uten manuell hoderegning.

   Resultatkode   Q<quiz><lag>-<poeng>-<sjekk>     f.eks. Q13-08-N
   Tavlekode      T-<15 bokstaver>-<sjekk>         hele stillingen

   Sjekkbokstaven fanger opp skrivefeil, så en kode som er tastet feil
   blir avvist i stedet for å gi noen poeng de ikke har. */
const KODEBOK = 'ABCDEFGHJKLMNPQRSTUVWXYZ';   /* uten I og O — de forveksles med 1 og 0 */
const IKKE_SPILT = 'Z';

let resultater = {};
try { resultater = JSON.parse(localStorage.getItem('blatur-res') || '{}'); } catch (e) {}
let gjetninger = {};
try { gjetninger = JSON.parse(localStorage.getItem('blatur-gjett') || '{}'); } catch (e) {}
function lagreGjetninger() {
  try { localStorage.setItem('blatur-gjett', JSON.stringify(gjetninger)); } catch (e) {}
}
let lbApen = true;

const resNokkel = (quizId, lagIdx) => quizId + '|' + lagIdx;

function lagreResultater() {
  try { localStorage.setItem('blatur-res', JSON.stringify(resultater)); } catch (e) {}
}
function settResultat(quizId, lagIdx, score) {
  resultater[resNokkel(quizId, lagIdx)] = score;
  lagreResultater();
}
function hentResultat(quizId, lagIdx) {
  const v = resultater[resNokkel(quizId, lagIdx)];
  return v === undefined ? null : v;
}

function sjekkTegn(s) {
  let sum = 0;
  for (let i = 0; i < s.length; i++) sum += s.charCodeAt(i) * (i + 3);
  return KODEBOK[sum % KODEBOK.length];
}
const normaliser = t => String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

function lagResultatkode(quizIdx, lagIdx, score) {
  const kropp = 'Q' + (quizIdx + 1) + (lagIdx + 1) + String(score).padStart(2, '0');
  return kropp + sjekkTegn(kropp);
}
function visKode(k) {
  return k[0] === 'Q'
    ? k.slice(0, 3) + '-' + k.slice(3, 5) + '-' + k.slice(5)
    : k[0] === 'G' ? k.slice(0, 2) + '-' + k.slice(2, 5) + '-' + k.slice(5)
    : k[0] + '-' + k.slice(1, -1) + '-' + k.slice(-1);
}
function lagTavlekode() {
  let kropp = 'T';
  (DATA.quizer || []).forEach(qz => {
    (qz.lag || []).forEach((l, j) => {
      const p = hentResultat(qz.id, j);
      kropp += (p === null ? IKKE_SPILT : KODEBOK[p]);
    });
  });
  return kropp + sjekkTegn(kropp);
}

/* Plukker ut alle koder i en tekst. Da kan Henrik kopiere hele
   meldingstråden og lime den inn i ett jafs, i stedet for kode for kode. */
function lesAlleKoder(tekst) {
  const ord = String(tekst || '').split(/[\s,;]+/).filter(Boolean);
  const funn = [];
  ord.forEach(o => {
    const r = lesKode(o);
    if (!r.feil) funn.push(r);
  });
  return funn;
}

/* Returnerer {type:'resultat'|'tavle', ...} eller {feil:'...'} */
function lesKode(tekst) {
  const k = normaliser(tekst);
  if (!k) return { feil: 'Skriv inn koden først.' };
  const kropp = k.slice(0, -1), sjekk = k.slice(-1);
  const quizer = DATA.quizer || [];

  if (k[0] === 'Q') {
    if (k.length !== 6) return { feil: 'Koden skal ha formen Q13-08-N. Sjekk at alt kom med.' };
    if (sjekkTegn(kropp) !== sjekk) return { feil: 'Koden stemmer ikke. Én bokstav eller ett tall er feil.' };
    const qi = parseInt(k[1], 10) - 1, li = parseInt(k[2], 10) - 1, sc = parseInt(k.slice(3, 5), 10);
    const qz = quizer[qi];
    if (!qz || !qz.lag[li]) return { feil: 'Koden peker på en quiz eller et lag som ikke finnes.' };
    if (sc > qz.sporsmal.length) return { feil: 'Poengsummen er høyere enn antall spørsmål.' };
    return { type: 'resultat', quizIdx: qi, lagIdx: li, score: sc, quiz: qz, lag: qz.lag[li] };
  }

  if (k[0] === 'G') {
    if (k.length !== 6) return { feil: 'Gjettekoden skal ha formen GD-XKQ-M.' };
    if (sjekkTegn(kropp) !== sjekk) return { feil: 'Gjettekoden stemmer ikke. Noe er tastet feil.' };
    const pi = KODEBOK.indexOf(k[1]);
    const navn = (DATA.deltakere || [])[pi];
    if (!navn) return { feil: 'Koden peker på en person som ikke finnes i lista.' };
    const s1 = KODEBOK.indexOf(k[2]), s2 = KODEBOK.indexOf(k[3]), s3 = KODEBOK.indexOf(k[4]);
    if (s1 < 0 || s2 < 0 || s3 < 0) return { feil: 'Gjettekoden inneholder et ugyldig tegn.' };
    return { type: 'gjett', navn: navn, km: s1 * 576 + s2 * 24 + s3 };
  }

  if (k[0] === 'T') {
    const antall = quizer.reduce((a, q) => a + q.lag.length, 0);
    if (k.length !== antall + 2) return { feil: 'Tavlekoden er ikke komplett. Be om den på nytt.' };
    if (sjekkTegn(kropp) !== sjekk) return { feil: 'Tavlekoden stemmer ikke. Noe er tastet feil.' };
    const nye = {}; let n = 0, p = 1, ugyldig = false;
    quizer.forEach(qz => qz.lag.forEach((l, j) => {
      const c = k[p++];
      if (c !== IKKE_SPILT) {
        const v = KODEBOK.indexOf(c);
        if (v < 0 || v > qz.sporsmal.length) { ugyldig = true; return; }
        nye[resNokkel(qz.id, j)] = v; n++;
      }
    }));
    if (ugyldig) return { feil: 'Tavlekoden inneholder en ugyldig verdi.' };
    return { type: 'tavle', nye: nye, antall: n };
  }
  return { feil: 'Ukjent kode. Den skal begynne med Q eller T.' };
}

async function delTekst(tekst) {
  try {
    if (navigator.share) { await navigator.share({ text: tekst }); return 'delt'; }
  } catch (e) { return 'avbrutt'; }
  try {
    await navigator.clipboard.writeText(tekst);
    return 'kopiert';
  } catch (e) { return 'nei'; }
}

/* ---------- Poengtavle ----------
   Poengene et lag får, godskrives hvert medlem. Fordi lagene er ulike i
   hver runde, blir totalen personlig selv om svarene er felles. */
function total(navn) {
  let sum = 0;
  (DATA.quizer || []).forEach(qz => {
    (qz.lag || []).forEach((l, j) => {
      if (l.medlemmer.includes(navn)) {
        const p = hentResultat(qz.id, j);
        if (p !== null) sum += p;
      }
    });
  });
  return sum;
}
function antallRunder(navn) {
  let n = 0;
  (DATA.quizer || []).forEach(qz => {
    (qz.lag || []).forEach((l, j) => {
      if (l.medlemmer.includes(navn) && hentResultat(qz.id, j) !== null) n++;
    });
  });
  return n;
}

/* Standard konkurranserangering: lik sum gir delt plass. */
function rangering() {
  const folk = (DATA.deltakere || []).slice()
    .map(n => ({ navn: n, sum: total(n), runder: antallRunder(n) }));
  folk.sort((a, b) => b.sum - a.sum || a.navn.localeCompare(b.navn, 'no'));
  let forrige = null, plass = 0;
  folk.forEach((f, i) => {
    if (forrige === null || f.sum !== forrige) plass = i + 1;
    f.plass = plass; forrige = f.sum;
  });
  return folk;
}

function tegnTavle() {
  const boks = $('#leaderboard');
  if (!boks) return;
  const folk = rangering();
  if (!folk.length) { boks.innerHTML = ''; return; }

  const spilt = folk.some(f => f.runder > 0);
  let h = `<div class="lb"><div class="lbtopp" id="lbtopp">
      <h2>🏆 Stillingen</h2><span class="pil">${lbApen ? 'Skjul ▾' : 'Vis ▸'}</span></div>`;

  if (!lbApen) {
    h += `<div class="lbnull">Leder: <b>${esc(folk[0].navn)}</b> med ${folk[0].sum} poeng.</div></div>`;
    boks.innerHTML = h;
    $('#lbtopp').onclick = () => { lbApen = !lbApen; tegnTavle(); };
    return;
  }

  if (!spilt) {
    h += `<div class="lbnull">Ingen resultater lagt inn ennå. Tavlen fyller seg ut
          etter hvert som lagene sender inn kodene sine.</div>`;
  }

  const pall = folk.slice(0, 3);
  if (pall.length === 3) {
    const kol = [
      { f: pall[1], kl: 'p2', m: '🥈' },
      { f: pall[0], kl: 'p1', m: '🥇' },
      { f: pall[2], kl: 'p3', m: '🥉' }
    ];
    h += '<div class="pall">' + kol.map(k =>
      `<div class="pl ${k.kl}">
         <div class="medalje">${k.m}</div>
         <div class="pnavn">${esc(k.f.navn)}</div>
         <div class="ppo">${k.f.sum} p</div>
         <div class="sokkel">${k.f.plass}</div>
       </div>`).join('') + '</div>';
  }

  const midt = folk.slice(3, Math.max(3, folk.length - 1));
  if (midt.length) {
    h += '<div>' + midt.map(f =>
      `<div class="lbrad">
         <div class="plass">${f.plass}</div>
         <div class="navn">${esc(f.navn)}</div>
         <div class="po">${f.sum}<small> p</small></div>
       </div>`).join('') + '</div>';
  }

  if (folk.length > 3) {
    const siste = folk[folk.length - 1];
    h += `<div class="lanterne">
        <div class="lykt">🏮</div>
        <div style="flex:1">
          <div class="lt">Lanterne Rouge · ${siste.plass}. plass</div>
          <div class="ln">${esc(siste.navn)}</div>
        </div>
        <div class="lp">${siste.sum} p</div>
      </div>`;
  }

  const maks = (DATA.quizer || []).reduce((a, q) => a + q.sporsmal.length, 0);
  h += `<div class="lbfot">Maks ${maks} poeng totalt. Tavlen viser det som er lagt inn på denne telefonen.<br>
        <button class="lbnullstill" id="lbdel">Del stillingen</button> ·
        <button class="lbnullstill" id="lbnull">Nullstill</button></div></div>`;

  boks.innerHTML = h;
  $('#lbtopp').onclick = () => { lbApen = !lbApen; tegnTavle(); };
  $('#lbdel').onclick = async () => {
    const kode = lagTavlekode();
    const r = await delTekst('Blåtur-quiz — stillingen så langt.\nLegg inn denne i appen under «Legg inn resultat»:\n' + visKode(kode));
    if (r === 'kopiert') visStatus('📋 Kopiert');
    else if (r === 'nei') alert('Tavlekode:\n\n' + visKode(kode));
  };
  $('#lbnull').onclick = () => {
    if (confirm('Nullstille alle resultater og gjett? Dette kan ikke angres.')) {
      resultater = {}; lagreResultater();
      gjetninger = {}; lagreGjetninger();
      tegnTavle(); tegnQuiz();
    }
  };
}

/* ---------- Gjettekonkurransen: hvem var nærmest ---------- */
function gjettTavleHtml() {
  const navn = Object.keys(gjetninger);
  if (!navn.length) return '';
  const rad = navn.map(n => ({ navn: n, km: gjetninger[n] }))
                  .sort((a, b) => a.km - b.km || a.navn.localeCompare(b.navn, 'no'));
  let forrige = null, plass = 0;
  rad.forEach((r, i) => { if (forrige === null || r.km !== forrige) plass = i + 1; r.plass = plass; forrige = r.km; });
  const medalje = p => p === 1 ? '🥇' : p === 2 ? '🥈' : p === 3 ? '🥉' : p;
  return `<div class="kort" style="margin-top:12px">
      <h2>📍 Hvem gjettet nærmest</h2>
      <div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:8px">
        Avstand i luftlinje fra nålen til Istanbul.</div>` +
    rad.map(r => `<div class="lbrad">
        <div class="plass">${medalje(r.plass)}</div>
        <div class="navn">${esc(r.navn)}</div>
        <div class="po">${r.km}<small> km</small></div>
      </div>`).join('') +
    `<div style="font-size:11.5px;color:var(--muted);margin-top:10px;text-align:center">
      ${rad.length} av ${(DATA.deltakere || []).length} har levert.</div></div>`;
}

/* ---------- Quiz ---------- */
let aktivQuiz = null, aktivtLag = null, aktivtLagIdx = null;
let qIdx = 0, qScore = 0, qSvart = false, qVisning = 'liste';

const quizNokkel = id => 'quiz-' + id;

function tegnQuiz() {
  const boks = $('#quiz');
  const quizer = DATA.quizer || [];
  tegnTavle();
  if (!quizer.length) { boks.innerHTML = '<div class="kort">Ingen quizer ennå.</div>'; return; }

  /* --- Legg inn resultat fra en annen telefon --- */
  if (qVisning === 'innlegg') {
    lbApen = true; tegnTavle();
    boks.innerHTML =
      `<div class="kort">
        <h2>Legg inn resultat</h2>
        <div style="font-size:14px;line-height:1.55;color:#39434f;margin-bottom:6px">
          Lim inn koden du har fått. <b>Q13-08-N</b> er et quizresultat,
          <b>GD-XKQ-M</b> er et gjett fra kartet, og en kode som begynner med <b>T</b>
          er hele quizstillingen fra en annen telefon.</div>
        <div style="font-size:13.5px;line-height:1.5;color:var(--muted);margin-bottom:12px">
          <b>Du kan lime inn flere om gangen.</b> Marker hele meldingstråden og lim den inn —
          appen plukker ut kodene selv og hopper over alt annet.</div>
        <div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:10px">
          ${Object.keys(gjetninger).length} av ${(DATA.deltakere || []).length} gjett levert</div>
        <input class="kodefelt" id="resfelt" type="text" inputmode="text" autocomplete="off"
               autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="Q13-08-N">
        <div class="kodefeil" id="resfeil"></div>
        <button class="knapp" id="resles">Les inn koden</button>
      </div>
      <div class="kort">
        <h2>Eller legg inn manuelt</h2>
        <div style="font-size:13.5px;line-height:1.5;color:var(--muted);margin-bottom:10px">
          Hvis koden er borte i gruppechatten.</div>
        <div class="manuell">
          <label>Quiz<select id="mQuiz">${quizer.map((q, i) =>
            `<option value="${i}">${esc(q.tittel)}</option>`).join('')}</select></label>
          <label>Lag<select id="mLag"></select></label>
          <label>Poeng<select id="mPoeng"></select></label>
        </div>
        <button class="knapp sek" id="mLagre">Lagre resultatet</button>
      </div>` +
      gjettTavleHtml() +
      `<button class="knapp" id="restilbake">Ferdig</button>`;

    const felt = $('#resfelt'), feil = $('#resfeil');

    const les = () => {
      /* Flere koder i samme innliming — vanligste tilfelle når han har
         fått ni SMS-er og kopierer hele tråden. */
      const flere = lesAlleKoder(felt.value);
      if (flere.length > 1) {
        const gj = flere.filter(x => x.type === 'gjett');
        const res = flere.filter(x => x.type === 'resultat');
        if (confirm(`Fant ${flere.length} koder:\n` +
            (gj.length ? `· ${gj.length} gjett fra kartet\n` : '') +
            (res.length ? `· ${res.length} quizresultater\n` : '') +
            `\nLegge inn alle?`)) {
          gj.forEach(x => { gjetninger[x.navn] = x.km; });
          res.forEach(x => { settResultat(x.quiz.id, x.lagIdx, x.score); });
          lagreGjetninger();
          felt.value = ''; feil.textContent = '';
          visStatus('✅ ' + flere.length + ' lagt inn');
          tegnQuiz();
        }
        return;
      }

      const r = lesKode(felt.value);
      if (r.feil) { feil.textContent = r.feil; return; }
      if (r.type === 'resultat') {
        const gammel = hentResultat(r.quiz.id, r.lagIdx);
        const tekst = `${r.quiz.tittel}\n${r.lag.navn} (${r.lag.medlemmer.join(', ')})\n` +
          `${r.score} av ${r.quiz.sporsmal.length} poeng` +
          (gammel !== null ? `\n\nDette laget står allerede med ${gammel} poeng. Overskrive?` : '\n\nLegge inn?');
        if (confirm(tekst)) {
          settResultat(r.quiz.id, r.lagIdx, r.score);
          felt.value = ''; feil.textContent = '';
          visStatus('✅ Lagt inn');
          tegnQuiz();
        }
      } else if (r.type === 'gjett') {
        const gammel = gjetninger[r.navn];
        if (confirm(`Gjett fra ${r.navn}\n${r.km} km unna` +
            (gammel !== undefined ? `\n\nStår allerede med ${gammel} km. Overskrive?` : '\n\nLegge inn?'))) {
          gjetninger[r.navn] = r.km; lagreGjetninger();
          felt.value = ''; feil.textContent = '';
          visStatus('✅ Gjett lagt inn');
          tegnQuiz();
        }
      } else {
        if (confirm(`Tavlekode med ${r.antall} resultater.\n\nDette erstatter stillingen på denne telefonen. Fortsette?`)) {
          resultater = r.nye; lagreResultater();
          felt.value = ''; feil.textContent = '';
          visStatus('✅ Stillingen oppdatert');
          tegnQuiz();
        }
      }
    };
    $('#resles').onclick = les;
    felt.onkeydown = e => { if (e.key === 'Enter') les(); };

    const mQuiz = $('#mQuiz'), mLag = $('#mLag'), mPoeng = $('#mPoeng');
    const tall = f => { const v = parseInt(f.value, 10); return isNaN(v) ? 0 : v; };
    const fyllLag = () => {
      const qz = quizer[tall(mQuiz)] || quizer[0];
      mLag.innerHTML = (qz.lag || []).map((l, j) =>
        `<option value="${j}">${esc(l.navn)}</option>`).join('');
      mPoeng.innerHTML = Array.from({ length: qz.sporsmal.length + 1 }, (_, i) =>
        `<option value="${i}">${i}</option>`).join('');
    };
    mQuiz.onchange = fyllLag;
    fyllLag();
    $('#mLagre').onclick = () => {
      const qz = quizer[tall(mQuiz)] || quizer[0];
      const li = tall(mLag), sc = tall(mPoeng);
      const l = qz.lag[li];
      if (!l) return;
      const gammel = hentResultat(qz.id, li);
      if (confirm(`${qz.tittel}\n${l.navn} (${l.medlemmer.join(', ')})\n${sc} poeng` +
          (gammel !== null ? `\n\nErstatter ${gammel} poeng.` : ''))) {
        settResultat(qz.id, li, sc);
        visStatus('✅ Lagt inn');
        qVisning = 'liste'; tegnQuiz();
      }
    };
    $('#restilbake').onclick = () => { qVisning = 'liste'; tegnQuiz(); };
    return;
  }

  /* --- Oversikt --- */
  if (qVisning === 'liste') {
    lbApen = true; tegnTavle();
    const info = DATA.quizinfo;
    boks.innerHTML =
      `<button class="knapp" id="qinnlegg" style="margin-top:0">＋ Legg inn resultat</button>` +
      gjettTavleHtml() +
      (info ? `<div class="kort" style="margin-top:12px"><h2>${esc(info.tittel)}</h2>
        <div style="font-size:14px;line-height:1.55;color:#39434f">${esc(info.tekst)}</div></div>` : '') +
      '<div id="qliste"></div>';
    $('#qinnlegg').onclick = () => { qVisning = 'innlegg'; tegnQuiz(); };
    const liste = $('#qliste');
    quizer.forEach(qz => {
      const apen = erApnet(quizNokkel(qz.id));
      const ferdige = (qz.lag || []).filter((l, j) => hentResultat(qz.id, j) !== null).length;
      const b = el('button', 'qkort' + (ferdige === (qz.lag || []).length ? ' ferdig' : ''));
      b.innerHTML =
        `<div class="qi">${apen ? (qz.ikon || '🎯') : '🔒'}</div>
         <div style="flex:1">
           <div class="qt">${esc(qz.tittel)}</div>
           <div class="qm">${!apen ? 'Låst · krever kode'
              : ferdige ? ferdige + ' av ' + qz.lag.length + ' lag har spilt'
              : qz.sporsmal.length + ' spørsmål · klar'}</div>
         </div>
         <div class="qs">›</div>`;
      b.onclick = () => { aktivQuiz = qz.id; qVisning = apen ? 'lag' : 'kode'; tegnQuiz(); };
      liste.appendChild(b);
    });
    return;
  }

  const qz = quizer.find(x => x.id === aktivQuiz);
  if (!qz) { qVisning = 'liste'; tegnQuiz(); return; }
  const quizIdx = quizer.indexOf(qz);

  /* --- Kodelås --- */
  if (qVisning === 'kode') {
    tegnLaas(boks, {
      ikon: qz.ikon || '🔒',
      tittel: qz.tittel,
      tekst: 'Denne quizen åpnes med en kode. Den får dere når runden starter.',
      kode: qz.kode
    }, quizNokkel(qz.id), () => { qVisning = 'lag'; tegnQuiz(); });
    const tilbake = el('button', 'knapp sek', 'Tilbake');
    tilbake.onclick = () => { qVisning = 'liste'; tegnQuiz(); };
    boks.appendChild(tilbake);
    return;
  }

  /* --- Velg lag --- */
  if (qVisning === 'lag') {
    lbApen = true; tegnTavle();
    boks.innerHTML =
      `<div class="kort" style="text-align:center">
        <div style="font-size:44px;line-height:1">${qz.ikon || '🎯'}</div>
        <h2 style="margin:8px 0 4px;font-size:20px">${esc(qz.tittel)}</h2>
        <p style="color:var(--muted);font-size:14px;line-height:1.55;margin:0">${esc(qz.ingress || '')}</p>
        <p style="font-size:13.5px;color:var(--muted);margin:14px 0 0"><b>Hvilket lag er dere?</b><br>
          Finn laget ditt og trykk. Poengene deles av alle tre.</p>
      </div>
      <div id="lagvalg"></div>`;
    const boksL = $('#lagvalg');
    (qz.lag || []).forEach((l, j) => {
      const p = hentResultat(qz.id, j);
      const b = el('button', 'lagkort lagvelg' + (p !== null ? ' spilt' : ''));
      b.innerHTML = `<b>${esc(l.navn)}</b><div>${l.medlemmer.map(esc).join(' · ')}</div>` +
        (p !== null ? `<div style="font-size:12.5px;color:var(--ok);font-weight:700;margin-top:5px">
            ✓ ${p} av ${qz.sporsmal.length} riktige — trykk for å spille om igjen</div>` : '');
      b.onclick = () => {
        aktivtLag = l; aktivtLagIdx = j;
        qIdx = 0; qScore = 0; qSvart = false; qVisning = 'spill'; tegnQuiz();
      };
      boksL.appendChild(b);
    });
    const tilbake = el('button', 'knapp sek', 'Til de andre quizene');
    tilbake.onclick = () => { qVisning = 'liste'; tegnQuiz(); };
    boks.appendChild(tilbake);
    return;
  }

  const sp = qz.sporsmal || [];

  /* --- Resultat med delekode --- */
  if (qIdx >= sp.length) {
    /* Resultatet føres først når runden faktisk er fullført. Et lag som
       avbryter midtveis skal ikke stå på tavlen med en halv poengsum. */
    if (aktivtLagIdx !== null) settResultat(qz.id, aktivtLagIdx, qScore);
    lbApen = true; tegnTavle();
    const pst = Math.round(qScore / sp.length * 100);
    let dom = 'Godkjent — så vidt.';
    if (pst === 100) dom = 'Feilfritt. Ingen kommer til å tro på dere.';
    else if (pst >= 80) dom = 'Sterkt. Laget kan noe.';
    else if (pst >= 50) dom = 'Midt på treet. Det holder ikke til pallen.';
    else dom = 'Laget spanderer neste runde.';
    if (aktivtLagIdx === null) { qVisning = 'lag'; tegnQuiz(); return; }
    const kode = lagResultatkode(quizIdx, aktivtLagIdx, qScore);
    boks.innerHTML =
      `<div class="qframe">
        <div class="score">${qScore}/${sp.length}</div>
        <div class="stolpe"><i style="width:${pst}%"></i></div>
        <p style="font-size:16px;font-weight:600;margin:8px 0 2px">${dom}</p>
        <p style="color:var(--muted);font-size:14px">${esc(aktivtLag ? aktivtLag.navn : '')} · ${esc(qz.tittel)}</p>
        <div class="kodeboks">
          <div class="kodetit">Send denne til Henrik</div>
          <div class="kodeverdi" id="reskode">${visKode(kode)}</div>
          <button class="knapp" id="ressend">📤 Send resultatet</button>
          <div class="kodehjelp">Uten dekning: skriv koden ned. Den er alt Henrik trenger.</div>
        </div>
        <button class="knapp sek" id="qtillisten">Til de andre quizene</button>
      </div>`;
    $('#ressend').onclick = async () => {
      const tekst = `Blåtur-quiz · ${qz.tittel} · ${aktivtLag.navn}\n` +
        `${qScore} av ${sp.length} poeng.\nKode: ${visKode(kode)}`;
      const r = await delTekst(tekst);
      if (r === 'kopiert') visStatus('📋 Kopiert — lim inn i SMS');
      else if (r === 'nei') alert(tekst);
    };
    $('#qtillisten').onclick = () => { qVisning = 'liste'; tegnQuiz(); };
    return;
  }

  /* --- Spørsmål --- */
  const q = sp[qIdx];
  boks.innerHTML =
    `<div class="qframe">
      <div class="qkat">${esc(qz.tittel)}${aktivtLag ? ' · ' + esc(aktivtLag.navn) : ''}</div>
      <div class="qteller">Spørsmål ${qIdx + 1} av ${sp.length} · ${qScore} riktige</div>
      <div class="stolpe"><i style="width:${qIdx / sp.length * 100}%"></i></div>
      <div class="qsp">${esc(q.sporsmal)}</div>
      <div id="qalt"></div>
      <div id="qfork"></div>
    </div>`;
  const alt = $('#qalt');
  (q.alternativer || []).forEach((a, i) => {
    const b = el('button', 'qalt', esc(a));
    b.onclick = () => svar(i);
    alt.appendChild(b);
  });
}

function svar(i) {
  if (qSvart) return;
  qSvart = true;
  const qz = (DATA.quizer || []).find(x => x.id === aktivQuiz);
  const sp = qz.sporsmal, q = sp[qIdx];
  document.querySelectorAll('#qalt .qalt').forEach((b, j) => {
    b.disabled = true;
    if (j === q.riktig) b.classList.add('riktig');
    else if (j === i) b.classList.add('feil');
  });
  if (i === q.riktig) { qScore++; if (navigator.vibrate) navigator.vibrate(40); }
  else if (navigator.vibrate) navigator.vibrate([40, 60, 40]);

  $('#qfork').innerHTML =
    `<div class="qfork">${i === q.riktig ? '✅ ' : '❌ '}${esc(q.forklaring || '')}</div>
     <button class="knapp" id="qneste">${qIdx + 1 >= sp.length ? 'Se resultatet' : 'Neste spørsmål'}</button>`;
  $('#qneste').onclick = () => { qIdx++; qSvart = false; tegnQuiz(); };
}

/* ---------- Oppslag ---------- */
function tegnOppslag() {
  const boks = $('#oppslag'); boks.innerHTML = '';
  const o = DATA.oppslag || [];
  if (!o.length) return;
  boks.appendChild(el('div', 'dag', '📣 Nytt'));
  o.forEach(x => {
    const kl = 'varsel v-' + (x.type === 'viktig' ? 'viktig' : x.type === 'gøy' ? 'gøy' : 'info');
    boks.appendChild(el('div', kl,
      `<div>${esc(x.tekst)}</div><div class="meta">${esc(x.tid || '')}${x.av ? ' · ' + esc(x.av) : ''}</div>`));
  });
}

/* ---------- Info ---------- */
function tegnInfo() {
  const boks = $('#info'); boks.innerHTML = '';
  (DATA.info || []).forEach(gr => {
    const k = el('div', 'kort');
    k.appendChild(el('h2', null, esc(gr.tittel)));
    const t = el('table');
    (gr.rader || []).forEach(r => t.appendChild(el('tr', null, `<td>${esc(r[0])}</td><td>${esc(r[1])}</td>`)));
    k.appendChild(t);
    boks.appendChild(k);
  });
  if (DATA.co2) tegnCo2(boks);

  if ((DATA.gjengen || []).length) {
    const k = el('div', 'kort');
    k.appendChild(el('h2', null, 'Gjengen'));
    const t = el('table');
    DATA.gjengen.forEach(p => t.appendChild(el('tr', null, `<td>${esc(p.navn)}</td><td>${esc(p.rolle || '')}</td>`)));
    k.appendChild(t); boks.appendChild(k);
  }
}

/* ---------- CO2 ---------- */
function tegnCo2(boks) {
  const c = DATA.co2;
  const k = el('div', 'kort');
  k.appendChild(el('h2', null, esc(c.tittel || 'Klimaavtrykk')));
  if (c.ingress) k.appendChild(el('p', null,
    `<span style="font-size:14px;line-height:1.55;color:#39434f">${esc(c.ingress)}</span>`));

  if (c.hoved) {
    const h = el('div', null,
      `<div style="text-align:center;padding:14px 0 6px">
        <div style="font-size:42px;font-weight:800;color:var(--red);letter-spacing:-1.5px;line-height:1">${esc(c.hoved.tall)}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(c.hoved.tekst)}</div>
      </div>`);
    k.appendChild(h);
  }
  const t = el('table');
  (c.rader || []).forEach(r => t.appendChild(el('tr', null, `<td>${esc(r[0])}</td><td>${esc(r[1])}</td>`)));
  k.appendChild(t);
  if (c.fot) k.appendChild(el('div', null,
    `<div style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px">${esc(c.fot)}</div>`));
  boks.appendChild(k);
}

/* ---------- Vær (live fra Open-Meteo) ---------- */
const VSYM = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',
  61:'🌧️',63:'🌧️',65:'🌧️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const VTXT = {0:'Klart',1:'Stort sett klart',2:'Delvis skyet',3:'Skyet',45:'Tåke',48:'Tåke',
  51:'Lett yr',53:'Yr',55:'Kraftig yr',61:'Lett regn',63:'Regn',65:'Kraftig regn',
  80:'Regnbyger',81:'Regnbyger',82:'Kraftige byger',95:'Torden',96:'Torden',99:'Torden'};

let vaerCache = null, vaerTid = 0;

async function tegnVaer(boks) {
  const v = DATA.vaer;
  const k = el('div', 'kort');
  k.appendChild(el('h2', null, esc(v.tittel || 'Værmelding')));
  const inn = el('div', null, '<div class="vlaster">Henter værmelding …</div>');
  k.appendChild(inn);
  boks.appendChild(k);

  /* tegnAlt kjører ved hver datahenting, altså hvert 30. sekund. Uten dette
     minnet ville værmeldingen blitt hentet like ofte — unødvendig trafikk og
     en synlig blink hver halve minutt. 30 minutter er ferskt nok for en
     døgnmelding. */
  if (vaerCache && Date.now() - vaerTid < 1800000) {
    inn.innerHTML = vaerCache;
    return;
  }

  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${v.lat}&longitude=${v.lon}` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=Europe%2FIstanbul&forecast_days=16`;
    const r = await fetch(u);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const idx = {};
    d.daily.time.forEach((t, i) => idx[t] = i);

    let html = '<div class="vaer">';
    let mangler = 0;
    (v.dager || []).forEach(dag => {
      const i = idx[dag.dato];
      if (i === undefined) { mangler++; return; }
      const kode = d.daily.weather_code[i];
      html += `<div class="vd">
        <div class="dag">${esc(dag.navn)}</div>
        <div class="sym">${VSYM[kode] || '🌡️'}</div>
        <div class="tmp">${Math.round(d.daily.temperature_2m_max[i])}°<small> / ${Math.round(d.daily.temperature_2m_min[i])}°</small></div>
        <div class="txt">${VTXT[kode] || ''}<br>${d.daily.precipitation_probability_max[i] ?? 0} % nedbør</div>
      </div>`;
    });
    html += '</div>';
    if (mangler) html += `<div class="vlaster">Meldingen rekker ikke helt fram ennå — den kommer ca. 10 dager før.</div>`;
    if (v.notat) html += `<div style="font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px">${esc(v.notat)}</div>`;
    vaerCache = html; vaerTid = Date.now();
    inn.innerHTML = html;
  } catch (e) {
    inn.innerHTML = '<div class="vlaster">Fikk ikke tak i værmeldingen. Prøv igjen når du er på nett.</div>';
  }
}

/* ---------- Faner ---------- */
function bytt(navn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  $('#t-' + navn).classList.add('on');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === navn));
  if (navn === 'kart') tegnKart();
  if (navn === 'fre' || navn === 'lor') tegnProgram(navn);
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => bytt(b.dataset.t));

$('#gpsknapp').onclick = () => {
  if (!kartLaget) tegnKart();
  gpsVakt !== null ? stoppGps() : startGps();
};

/* ---------- Tegn alt ---------- */
function tegnAlt() {
  if (!DATA) return;
  $('#datoer').textContent = (DATA.tur?.datoer || '') + ' · ' + (DATA.tur?.hotell?.adresse || '');
  document.title = DATA.tur?.tittel || 'Blåtur';
  tegnAvsloring();
  tegnNedtelling();
  tegnProgram('fre');
  tegnProgram('lor');
  tegnInfo();
  if (DATA.vaer) tegnVaer($('#info'));
  tegnOppslag();
  if (qVisning === 'liste') tegnQuiz(); else tegnTavle();
  if ($('#t-kart').classList.contains('on')) tegnKart();
}

/* ---------- Offline ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
window.addEventListener('online',  () => { visStatus('📶 Tilbake på nett'); hentData(false); });
window.addEventListener('offline', () => visStatus('📴 Offline — lagret versjon'));

/* ---------- Start ---------- */
hentData(true);
setInterval(() => hentData(false), 30000);
setInterval(tegnNedtelling, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) hentData(false); });
</script>
